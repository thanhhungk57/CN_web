<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng 8/3 - Gửi đến Kim Anh 💖</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffecf2;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: inline-block;
        }
        button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff1493;
        }
        img {
            width: 250px;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>💖 Gửi đến Kim Anh 💖</h1>
    <p>Chúc mừng ngày 8/3, ngày đặc biệt dành riêng cho chị !</p>

    <div class="card">
        <p id="message">Bấm vào nút để nhận một lời chúc đặc biệt! 🎁</p>
        <button onclick="showMessage()">Nhận lời chúc 🌸</button>
        <br><br>

        <!-- 🖼️ Chỗ để chèn ảnh -->
        <img id="kimanh-photo" src="Kady.jpg" alt="Ảnh của Kim Anh">
    </div>

    <script>
        const messages = [
            "Chúc Kim Anh luôn xinh đẹp, hạnh phúc và đạt được mọi ước mơ của mình! 🌸",
            "Kim Anh à, hôm nay là ngày của những bông hoa đẹp nhất, và chị chính là một trong số đó. Chúc chị luôn rạng rỡ, hạnh phúc và được yêu thương thật nhiều! 💕",
            "Hãy luôn cười tươi như những bông hoa mùa xuân nhé! 🌼",
            "Kim Anh à, chúc chị một ngày 8/3 tràn đầy yêu thương, luôn cười tươi và gặp nhiều may mắn. Ngủ ngon nhé!💖",
            "Mong mọi điều tốt đẹp nhất luôn đến với chị, cô gái tuyệt vời của ngày hôm nay! 🎀"
        ];
        
        const images = [
            "image1.jpg",
            "image2.jpg",
            "image3.jpg",
            "image4.jpg",
            "image5.jpg"
        ];

        function showMessage() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById("message").textContent = messages[randomIndex];
            document.getElementById("kimanh-photo").src = images[randomIndex];
        }
    </script>
</body>
</html>
